<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&amp;display=swap');
      
      .grid {
        fill: none;
        stroke: rgba(255, 255, 255, 0.05);
        stroke-width: 1;
      }
      .dot { fill: rgba(255, 255, 255, 0.15); }
      
      .terminal-text {
        font-family: 'Geist Mono', monospace;
        font-size: 12px;
        fill: #cccccc;
        white-space: pre;
      }
      .term-prompt { fill: #ee3a17; font-weight: bold; }
      .term-quote { fill: #ffffff; font-style: italic; }
      .term-warning { fill: #ee3a17; font-weight: bold; }
      .term-label { fill: #666666; }
      .term-val { fill: #ffffff; }
      
      /* Scanline Animation */
      .scanline {
        animation: scan 6s linear infinite;
      }
      @keyframes scan {
        0% { transform: translateY(-100px); }
        100% { transform: translateY(400px); }
      }
      
      /* Rotating Skull Animation */
      .skull {
        animation: rotate 20s linear infinite;
        transform-origin: 200px 200px;
      }
      @keyframes rotate {
        0% { transform: rotateY(0deg); }
        100% { transform: rotateY(360deg); }
      }
    </style>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" class="grid"/>
      <circle cx="0" cy="0" r="1.5" class="dot"/>
    </pattern>

    <!-- Scanline Gradient -->
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.05)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
  </defs>

  <!-- BACKGROUND -->
  <rect width="100%" height="100%" fill="#000000" />
  <rect width="100%" height="100%" fill="url(#gridPattern)" />
  
  <!-- SCANLINE ANIMATION -->
  <rect x="0" y="0" width="100%" height="60px" fill="url(#scanGrad)" class="scanline" />

  <!-- LEFT SIDE: ROTATING SKULL -->
  <!-- REPLACE THE URL BELOW WITH YOUR SKULL LINK -->
  <image class="skull" href="YOUR_SKULL_LINK_HERE.png" x="100" y="100" width="200" height="200" />

  <!-- RIGHT SIDE: TERMINAL TEXT -->
  <g class="terminal-text" transform="translate(380, 80)">
    
    <tspan class="term-prompt" x="0" dy="0">$ whoami → nnmeexplt</tspan>
    <tspan x="0" dy="25" class="term-quote">"Your bio or motto goes here."</tspan>
    
    <tspan x="0" dy="25" class="term-warning">⚠️ Heads up! These are personal projects.</tspan>
    <tspan x="0" dy="15">One person behind it all, not a company.</tspan>
    
    <tspan x="0" dy="30" class="term-label">Builds:</tspan>    <tspan class="term-val"> ESP32, nRF24, RF-Clown</tspan>
    <tspan x="0" dy="15" class="term-label">Radios:</tspan>    <tspan class="term-val"> Wi-Fi, BLE, Sub-GHz</tspan>
    <tspan x="0" dy="15" class="term-label">Languages:</tspan> <tspan class="term-val"> C++, Python, HTML</tspan>
    
    <tspan x="0" dy="30" class="term-prompt">Contact</tspan>
    <tspan x="0" dy="15" class="term-label">Email:</tspan>    <tspan class="term-val"> your@email.com</tspan>
    <tspan x="0" dy="15" class="term-label">Web:</tspan>      <tspan class="term-val"> yourwebsite.com</tspan>
    <tspan x="0" dy="15" class="term-label">GitHub:</tspan>   <tspan class="term-val"> @yourusername</tspan>
    
  </g>
</svg>