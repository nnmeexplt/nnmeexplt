<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,Consolas,ui-monospace,monospace" width="985px" height="580px" font-size="16px">
<style>
@font-face {
src: local('JetBrains Mono'), local('JetBrainsMono'), local('Consolas');
font-family: 'JetBrains Mono';
font-display: swap;
}
/* Base text colors */
.key {fill: #992222;} /* Dark Red Accent */
.value {fill: #f4f4f5;} /* White */
.cc {fill: #88888c;} /* Mid Grey */
.head {fill: #f4f4f5;}
text, tspan {white-space: pre;}

/* Scanline Colors */
.slow-scan {fill: url(#scanSlow);}
.fast-scan {fill: url(#scanFast);}
</style>
<defs>
<clipPath id="card"><rect width="985" height="580" rx="12"/></clipPath>

<pattern id="dots" width="56" height="56" patternUnits="userSpaceOnUse">
  <path d="M0 28h56M28 0v56" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="0.5"/>
  <circle cx="28" cy="28" r="1.15" fill="#992222" fill-opacity="0.45"/>
</pattern>

<linearGradient id="scanSlow" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="45%" stop-color="#ffffff" stop-opacity="0.03"/>
  <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
  <stop offset="55%" stop-color="#ffffff" stop-opacity="0.03"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>

<linearGradient id="scanFast" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="45%" stop-color="#ffffff" stop-opacity="0.05"/>
  <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15"/>
  <stop offset="55%" stop-color="#ffffff" stop-opacity="0.05"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>

<radialGradient id="glowTop" cx="50%" cy="50%" r="70%">
  <stop offset="0%" stop-color="#992222" stop-opacity="0.16"/>
  <stop offset="68%" stop-color="#992222" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glowBot" cx="50%" cy="50%" r="70%">
  <stop offset="0%" stop-color="#992222" stop-opacity="0.10"/>
  <stop offset="70%" stop-color="#992222" stop-opacity="0"/>
</radialGradient>

<filter id="grain" x="0%" y="0%" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
</filter>
<filter id="logoGlow" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="4" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<g clip-path="url(#card)">
  
  <ellipse cx="492" cy="-10" rx="420" ry="230" fill="url(#glowTop)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="860" cy="540" rx="260" ry="190" fill="url(#glowBot)">
    <animate attributeName="opacity" values="0.4;0.85;0.4" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <rect x="-80" y="-80" width="1145" height="840" fill="url(#dots)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="56 56" dur="72s" repeatCount="indefinite"/>
  </rect>
  <g opacity="0.45">
    <rect x="-80" y="-80" width="1145" height="840" fill="url(#dots)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-56 -40" dur="96s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect width="985" height="140" class="slow-scan">
    <animate attributeName="y" values="-140;580" dur="10s" repeatCount="indefinite"/>
  </rect>
  <rect width="985" height="30" class="fast-scan">
    <animate attributeName="y" values="-30;580" dur="3s" repeatCount="indefinite"/>
  </rect>

  <rect width="985" height="580" filter="url(#grain)" opacity="0.04"/>

  <g filter="url(#logoGlow)">
    <image href="skull.gif" x="342" y="140" width="300" height="300" opacity="0.95"/>
  </g>

  <rect x="0.5" y="0.5" width="984" height="579" fill="none" stroke="#ffffff" stroke-opacity="0.08" rx="12"/>
  <path d="M8 42 V8 H42" fill="none" stroke="#992222" stroke-width="1.2" stroke-linecap="square"/>
  <path d="M943 8 H977 V42" fill="none" stroke="#992222" stroke-width="1.2" stroke-linecap="square"/>
  <path d="M8 538 V572 H42" fill="none" stroke="#992222" stroke-width="1.2" stroke-linecap="square"/>
  <path d="M943 572 H977 V538" fill="none" stroke="#992222" stroke-width="1.2" stroke-linecap="square"/>


  <text x="40" y="60">
    <tspan class="key">$ whoami</tspan><tspan class="cc"> → </tspan><tspan class="value">nnmeexplt</tspan>
    <tspan x="40" y="85" class="cc">"Tech enthusiast, morally questionable."</tspan>
  </text>

  <text x="945" y="60" text-anchor="end">
    <tspan class="value">One person. One vision. No limits.</tspan>
    <tspan x="945" y="85" class="key">These are personal projects made by me.</tspan>
  </text>

  <text x="40" y="480">
    <tspan class="key">- ABOUT ME</tspan>
    <tspan x="40" y="510" class="value">Cybersecurity Engineer & Embedded Systems Developer from Greece.</tspan>
    <tspan x="40" y="530" class="value">Focused mainly on IoT Engineering and Security Research.</tspan>
    <tspan x="40" y="550" class="value">Fascinated by offensive security, low-level systems, and IoT Technology.</tspan>
  </text>

  <text x="945" y="480" text-anchor="end">
    <tspan class="key">- CONTACT ME</tspan>
    <tspan x="945" y="510" class="value">nonametester@proton.me</tspan>
    <tspan x="945" y="530" class="value">nnmestore.pages.dev</tspan>
    <tspan x="945" y="550" class="value">@nnme.dev</tspan>
  </text>

</g>
</svg>
